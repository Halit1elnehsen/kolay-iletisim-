name: kolay_iletisim
description: "SpeakBridge - Turist Sesli Çeviri Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Ses - Konuşma tanıma ve metin-ses dönüşümü
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2

  # Çeviri - Ücretsiz HTTP API (MyMemory + Lingva)
  http: ^1.2.1

  # State Management
  provider: ^6.1.2

  # Navigasyon
  go_router: ^13.2.0

  # Yerel Depolama
  shared_preferences: ^2.2.3

  # Konum & Harita & Yönlendirme
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  url_launcher: ^6.2.6
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # İzinler
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  image_picker: ^1.0.7
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/phrases/
  fonts: []